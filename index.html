<style>
/* Look: mint page, one black hero card holding the date and capture bar, lime as the single action colour, tasks as soft white cards, areas as round pills. */
:root {
  --bg: #e8fbd2;
  --surface: #ffffff;
  --ink: #111411;
  --muted: #5d6a58;
  --line: #e3ecd9;
  --accent: #111411;
  --accent-soft: #dff5b8;
  --late: #b3331f;
  --del-bg: #fbd5ce;
  --del-ink: #8a2312;
  --ok: #111411;
  --band: #121512;
  --band-ink: #f6fbef;
  --band-muted: #a9b5a2;
  --gold: #bfef4a;
  --gold-ink: #121a00;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d110b; --surface: #171c15; --ink: #eef6e6; --muted: #9aa793; --line: #252d21;
    --accent: #bfef4a; --accent-soft: #2a3516; --late: #ff9a89; --del-bg: #4a2520; --del-ink: #ffb9ac; --ok: #bfef4a; --band: #1d241a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d110b; --surface: #171c15; --ink: #eef6e6; --muted: #9aa793; --line: #252d21;
  --accent: #bfef4a; --accent-soft: #2a3516; --late: #ff9a89; --del-bg: #4a2520; --del-ink: #ffb9ac; --ok: #bfef4a; --band: #1d241a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { padding-top: 20px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.brand::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 7px var(--gold), inset 0 0 0 13px #121512; }
.hero { background: var(--band); color: var(--band-ink); border-radius: 28px; padding: 24px 22px 18px; position: relative; overflow: hidden; }
.hero::after { content: "✦"; position: absolute; right: 26px; top: 20px; font-size: 30px; color: var(--gold); }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 10px; max-width: 80%; text-wrap: balance; }
.sum { margin: 0 0 20px; color: var(--band-muted); font-size: 15.5px; }
.sum b { color: var(--gold); font-weight: 700; }
.capture { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; background: rgba(255,255,255,0.08); border-radius: 999px; padding: 6px 6px 6px 18px; }
.capin { position: relative; display: flex; align-items: center; min-width: 0; }
.capture .capin input[type="text"] { flex: 1; padding-right: 66px; }
.capin button { position: absolute; right: 2px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.18); color: var(--band-ink); font-size: 17px; line-height: 1; cursor: pointer; }
.capin button[hidden] { display: none; }
.capin #cap-clear { right: 34px; }
.capin #cap-mic { display: flex; align-items: center; justify-content: center; }
.capin #cap-mic.on { background: #e5484d; color: #fff; animation: micpulse 1.2s infinite; }
@keyframes micpulse { 0% { box-shadow: 0 0 0 0 rgba(229,72,77,.6); } 100% { box-shadow: 0 0 0 10px rgba(229,72,77,0); } }
.capture:focus-within { box-shadow: 0 0 0 2px var(--gold); }
.capture input[type="text"] { background: none; border: 0; outline: none; padding: 10px 0; font-size: 16.5px; color: var(--band-ink); min-width: 0; }
.capture input::placeholder { color: var(--band-muted); opacity: 0.9; }
.capture select { background: transparent; border: 0; color: var(--band-muted); padding: 8px 4px; max-width: 150px; min-width: 0; font-size: 14px; }
.capture select option { background: var(--surface); color: var(--ink); }
.add { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 700; }
.add:hover { filter: brightness(1.05); }

.page { padding-block: 18px 80px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; background: var(--surface); border: 0; border-radius: 999px; padding: 10px 16px; color: var(--ink); font-weight: 500; display: flex; align-items: baseline; gap: 6px; }
.tabs button:hover { background: var(--accent-soft); }
.tabs button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
.tabs .n { font-size: 12px; opacity: 0.6; font-variant-numeric: tabular-nums; }
.focusbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; }
.focusbar:empty { display: none; }
.focusbar .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.focusbar button { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 13.5px; }
.focusbar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.focusbar .add-f { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.focusbar .fgroup { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px; padding: 3px; }
.focusbar .fgroup .sep { color: var(--muted); }
.focusbar .fgroup button { border-color: transparent; }
.focusbar .fgroup .child { font-size: 13px; border-color: var(--line); }
.focus-input { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13.5px; width: 160px; }

#lists { display: flex; flex-direction: column; gap: 22px; margin-top: 20px; }
.group > h2 { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0 4px 10px; }
.group > h2 .c { font-size: 12px; font-weight: 600; background: var(--surface); border-radius: 999px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.group.attn > h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--gold); }
.list { list-style: none; margin: 0; padding: 4px 18px; background: var(--surface); border-radius: 24px; }
.group.attn .list { background: var(--band); color: var(--band-ink); }
.group.attn .meta, .group.attn .check { color: var(--band-muted); }
.group.attn .check { border-color: var(--band-muted); }
.group.attn .task { border-color: rgba(255,255,255,0.1); }
.group.attn .meta .focus { color: var(--gold); }
.group.attn .meta .soon, .group.attn .meta .late { color: var(--gold); }
.group.attn .panel input, .group.attn .panel select, .group.attn .panel textarea, .group.attn .quick button { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: var(--band-ink); }
.group.attn .panel label { color: var(--band-muted); }
.group.attn .panel .inline { color: var(--band-ink); }
.task { border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.task .swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 700; font-size: 14px; pointer-events: none; opacity: 0; }
.task.dragging .swipe-bg { opacity: 1; }
.task .swipe-bg .l { color: var(--gold-ink); }
.task .swipe-bg .r { color: var(--del-ink); }
.task.sw-right .swipe-bg { background: var(--gold); }
.task.sw-left .swipe-bg { background: var(--del-bg); }
.task.dragging .row { transition: none; }
.row { background: var(--row-bg, var(--surface)); touch-action: pan-y; transition: transform .18s ease; position: relative; }
.group.attn .row { --row-bg: var(--band); }
.toast button { background: none; border: 0; color: var(--gold); font-weight: 700; margin-left: 10px; padding: 0; }
.task:last-child { border-bottom: 0; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 15px 0; align-items: start; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); background: none; padding: 0; display: grid; place-items: center; }
.check:hover { border-color: var(--ink); background: var(--gold); }
.done .check { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.check svg { width: 12px; height: 12px; opacity: 0; }
.done .check svg { opacity: 1; }
.ttl { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 16.5px; line-height: 1.35; display: block; width: 100%; overflow-wrap: anywhere; }
.done .ttl { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.meta { margin-top: 4px; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.meta span + span::before { content: none; }
.meta .focus { color: var(--ink); font-weight: 600; }
.meta .late { color: var(--late); font-weight: 600; }
.meta .soon { color: var(--ink); font-weight: 600; }
.panel { grid-column: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 10px 0 2px; }
.panel label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
.panel .wide { grid-column: 1 / -1; }
.panel { align-items: start; }
.panel .fld { display: flex; flex-direction: column; gap: 4px; margin-top: 0; min-width: 0; }
.panel .fl { display: block; font-size: 12px; color: var(--muted); font-weight: 600; opacity: 1; margin: 0; }
.panel .rp { display: flex; flex-direction: column; gap: 4px; }
.panel .quick { margin-top: 0; }
.panel .dt { display: flex; gap: 8px; }
.panel .dt input { flex: 1; min-width: 0; }
.panel input[type="text"], .panel input[type="date"], .panel input[type="time"], .panel select, .panel textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; font-weight: 400; font-size: 14.5px; min-width: 0; width: 100%; }
.panel textarea { min-height: 72px; resize: vertical; }
.panel .inline { flex-direction: row; align-items: center; gap: 8px; font-size: 14.5px; color: var(--ink); font-weight: 500; }
.panel .inline input { width: 18px; height: 18px; accent-color: var(--ink); }
.subs { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; }
.subs .st { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.sub { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.sub .sc { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); background: none; padding: 0; flex: none; display: grid; place-items: center; }
.sub .sc svg { width: 10px; height: 10px; opacity: 0; }
.sub.sdone .sc { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.sub.sdone .sc svg { opacity: 1; }
.sub .sx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sub.sdone .sx { text-decoration: line-through; color: var(--muted); }
.sub .sd { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
.sub .sd:hover { color: var(--late); }
.subs input.sn { border: 1px dashed var(--muted); background: transparent; border-radius: 12px; padding: 8px 12px; font-size: 14.5px; width: 100%; margin-top: 4px; }
.meta .prog { font-weight: 600; color: var(--ink); }
.group .panel .quick button[aria-pressed="true"], .quick button[aria-pressed="true"] { background: #bfef4a; color: #111; border-color: #bfef4a; }
.panel .rp .quick label.every { font-size: 12.5px; display: inline-flex; flex-direction: row; align-items: center; gap: 6px; margin: 0; white-space: nowrap; }
.panel .rp .quick input[type=number] { width: 64px; min-width: 0; padding: 5px 8px; margin: 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.quick button, .del { border: 0; background: var(--accent-soft); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; }
.del { color: var(--del-ink); justify-self: start; background: var(--del-bg); border: 0; font-weight: 700; }
.del.sure { background: var(--late); color: #fff; }
.empty { padding: 44px 0; text-align: center; color: var(--muted); }
.empty b { display: block; font-family: var(--font-display); font-size: 22px; color: var(--ink); margin-bottom: 4px; }
.toggle-done { align-self: start; background: var(--surface); border: 0; border-radius: 999px; color: var(--ink); font-weight: 600; padding: 8px 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.skel { height: 56px; border-radius: 20px; background: var(--surface); opacity: 0.5; }
#review, #nudge { margin-top: 14px; }
.task .nudgebox { margin: 4px 10px 12px; border-radius: 18px; padding: 14px; border-width: 1.5px; text-align: left; }
.task .nudgebox h2 { font-size: 16px; }
.task .nudgebox { color: var(--ink); }
.task .nudgebox .chips button { color: var(--ink); }
.task .nudgebox .chips button[aria-pressed="true"] { color: var(--bg); }
.task .nudgebox .cancel { color: var(--muted); }
.rv { background: var(--surface); border-radius: 24px; padding: 18px 18px 16px; border: 2px solid var(--gold); }
.rv h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 2px; }
.rv .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.rv label.t { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
.rv input[type="text"], .rv input[type="date"], .rv input[type="time"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15.5px; }
.rv .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rv .chips button { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 5px 13px; font-size: 13.5px; }
.rv .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.rv .q { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; margin-top: 12px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rv .q .chips { margin-left: auto; }
.rv .act { display: flex; gap: 8px; margin-top: 16px; }
.rv .save { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 700; }
.rv .cancel { background: none; border: 0; color: var(--muted); padding: 11px 12px; }
.rv .busy { color: var(--muted); font-size: 13.5px; }
.searchbar { position: relative; margin-bottom: 14px; }
.searchbar input { width: 100%; border: 0; background: var(--surface); border-radius: 999px; padding: 12px 40px 12px 18px; font-size: 15.5px; }
.searchbar input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.searchbar input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.searchbar button[hidden] { display: none; }
.searchbar button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--accent-soft); font-size: 18px; line-height: 1; }
body.searching .tabs, body.searching .focusbar { display: none; }
@media (max-width: 600px) {
  .hero { padding: 20px 18px 14px; border-radius: 24px; }
  .hero h1 { font-size: 34px; }
  .sum { font-size: 14.5px; margin-bottom: 16px; }
  .capture { grid-template-columns: minmax(0, 1fr) auto; border-radius: 24px; padding: 6px 6px 6px 16px; }
  .capture input[type="text"] { font-size: 16px; }
  .capture select { padding-left: 0; }
  .panel { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr); }
}

<script>
(function () {
  var AREAS = [
    { id: "personal", name: "Personal (private)" },
    { id: "tranquebar", name: "Tranquebar Home" },
    { id: "okkal", name: "Okkal" }
  ];
  var db = null, state = "loading", goals = [], glogs = [], goalEdit = null, goalOpen = "", goalCustom = "", goalsCollapsed = (function () { try { var v = localStorage.getItem("goalsCollapsed"); return v === null ? null : v === "1"; } catch (e) { return null; } })();
  var tasks = [], foci = [];
  var filter = { area: "all", focus: "", person: "" };
  var query = "", openId = null, confirmDel = null, showDone = false, addingFocus = false, pendingRender = false;
  var chains = {};
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function areaName(id) { for (var i = 0; i < AREAS.length; i++) if (AREAS[i].id === id) return AREAS[i].name; return "Tranquebar Home"; }
  function pad(n) { return String(n).padStart(2, "0"); }

  function splitNames(v) { return String(v || "").split(/[,;&]|\band\b/i).map(function (x) { return x.trim(); }).filter(Boolean); }
  function knownPeople() { var c = {}; tasks.forEach(function (t) { splitNames(t.people).concat(splitNames(t.involved)).forEach(function (n) { var k = n.toLowerCase(); c[k] = c[k] || { n: n, c: 0 }; c[k].c++; }); }); return Object.keys(c).map(function (k) { return c[k]; }).sort(function (a, b) { return b.c - a.c; }).slice(0, 8).map(function (x) { return x.n; }); }
  function togName(list, n) { var a = splitNames(list), i = a.map(function (x) { return x.toLowerCase(); }).indexOf(n.toLowerCase()); if (i >= 0) a.splice(i, 1); else a.push(n); return a.join(", "); }
  var ppOpen = "";
  function addName(list, n) { n = n.trim(); if (!n) return list; return splitNames(list).map(function (x) { return x.toLowerCase(); }).indexOf(n.toLowerCase()) >= 0 ? list : splitNames(list).concat([n]).join(", "); }
  function pplist(label, cur, key, field, rowAttrs, openAttrs, cls) {
    var sel = splitNames(cur), open = ppOpen === key, ks = knownPeople();
    sel.forEach(function (n) { if (ks.map(function (x) { return x.toLowerCase(); }).indexOf(n.toLowerCase()) < 0) ks.push(n); });
    var h = '<div class="fld' + (cls ? " " + cls : "") + '"><span class="fl">' + label + '</span><div class="pp"><button type="button" class="pp-btn" ' + openAttrs + ' aria-expanded="' + open + '"><span class="' + (sel.length ? "" : "ph") + '">' + esc(sel.length ? sel.join(", ") : "Select people") + '</span><span class="car" aria-hidden="true">\u25be</span></button>';

        '<input type="text" class="pp-new" data-pp-new="' + field + '" placeholder="Add a new name, press Enter"></div>';
    }
    return h + "</div></div>";
  }
  function fmtTime(h) { var m = /^(\d{1,2}):(\d{2})$/.exec(h || ""); if (!m) return ""; var H = +m[1]; return ((H % 12) || 12) + (m[2] === "00" ? "" : ":" + m[2]) + (H < 12 ? " am" : " pm"); }

  function repeatOf(txt) { var m = REPEAT_RE.exec(txt || ""); if (!m) return ""; var w = m[1].toLowerCase().replace(/\s+/g, ""); return /day/.test(w) && !/week/.test(w) ? "daily" : /month/.test(w) ? "monthly" : "weekly"; }
  function repeatEveryOf(txt) { var m = /every\s*(\d+)\s*(?:day|week|month)/i.exec(txt || ""); return m ? Math.max(1, +m[1]) : 1; }
  function repLabel(t) { var n = t.repeatEvery || 1, u = { daily: "day", weekly: "week", monthly: "month" }[t.repeat] || "day"; return n > 1 ? "Every " + n + " " + u + "s" : REPEAT_LABEL[t.repeat] || "Repeats"; }
  var REPEAT_LABEL = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" };
  function nextRepeat(rep, from, every, mode) {
    var n = Math.max(1, every || 1), t = todayIso(), d = new Date(((mode === "fixed" ? from : t) || t) + "T00:00:00"), guard = 0;
    function step() { if (rep === "daily") d.setDate(d.getDate() + n); else if (rep === "weekly") d.setDate(d.getDate() + 7 * n); else d.setMonth(d.getMonth() + n); }
    do { step(); guard++; } while (mode === "fixed" && iso(d) <= t && guard < 400);
    return iso(d);
  }
  /* Offline reading of a note: day, time and "follow up with <name>" when the AI is unavailable or misses them. */
  function quickParse(raw) {
    var out = { remindOn: "", remindTime: "", people: "", involved: "", delegated: false, repeat: repeatOf(raw), repeatEvery: repeatEveryOf(raw) }, low = raw.toLowerCase(), m;
    if ((m = /\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/.exec(low))) { var H = +m[1] % 12 + (m[3] === "pm" ? 12 : 0); out.remindTime = pad(H) + ":" + (m[2] || "00"); }
    else if ((m = /\b([01]?\d|2[0-3]):([0-5]\d)\b/.exec(low))) out.remindTime = pad(+m[1]) + ":" + m[2];
    if (/\b(today|tonight|this (morning|afternoon|evening))\b/.test(low)) out.remindOn = inDays(0);
    else if (/\btomorrow\b/.test(low)) out.remindOn = inDays(1);
    else if (/\bnext week\b/.test(low)) out.remindOn = inDays(7);
    else if ((m = /\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/.exec(low))) { var wd = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"].indexOf(m[1]); var n = (wd - new Date().getDay() + 7) % 7 || 7; out.remindOn = inDays(n); }
    if ((out.remindTime || out.repeat) && !out.remindOn) out.remindOn = inDays(0);

      while ((tok = re.exec(rest)) && names.length < 6) { names.push(tok[1]); rest = rest.slice(tok[0].length); }

      out.people = names.join(", ");

    return out;
  }
  function dueInfo(s) {
    var t = todayIso();
    if (s < t) return { text: "Overdue " + fmt(s), cls: "late" };
    if (s === t) return { text: "Today", cls: "soon" };
    if (s === inDays(1)) return { text: "Tomorrow", cls: "" };
    return { text: fmt(s), cls: "" };
  }
  function toast(msg) {
    var el = $("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 3500);
  }
  function toastUndo(msg, fn) {
    var el = $("toast"); el.textContent = msg + " "; var b = document.createElement("button"); b.type = "button"; b.textContent = "Undo";
    b.addEventListener("click", function () { el.hidden = true; fn(); }); el.appendChild(b); el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 6000);
  }
  function fail(err) { toast(err && err.code === "invalid_argument" ? "You can view this planner but not change it." : "That did not save. Try again in a moment."); }

  function save(id, patch) {
    var p = (chains[id] || Promise.resolve()).then(function () { return db.doc("tasks/" + id).update(patch); }).catch(fail);
    chains[id] = p; return p;
  }
  function parentOf(name) { for (var i = 0; i < foci.length; i++) if (foci[i].name === name) return foci[i].parent || ""; return ""; }
  function matchesFocus() { return true; }
  function byRemind(a, b) {
    var x = (a.remindOn || "9999") + (a.remindTime || ""), y = (b.remindOn || "9999") + (b.remindTime || "");
    return x < y ? -1 : x > y ? 1 : (a.createdAt || 0) - (b.createdAt || 0);
  }

  function renderTabs() {
    var open = tasks.filter(function (t) { return !t.done; });
    var html = '<button type="button" data-act="area" data-area="all" aria-pressed="' + (filter.area === "all") + '">All<span class="n">' + (open.length || "") + "</span></button>";
    AREAS.forEach(function (a) {
      var n = open.filter(function (t) { return (t.area || "tranquebar") === a.id; }).length;
      html += '<button type="button" data-act="area" data-area="' + a.id + '" aria-pressed="' + (filter.area === a.id) + '">' + esc(a.name) + '<span class="n">' + (n || "") + "</span></button>";
    });
    $("tabs").innerHTML = html;
    var sel = $("tabs").querySelector('[aria-pressed="true"]');
    if (sel && sel.scrollIntoView && !renderTabs.did) { renderTabs.did = true; }

    $("foci").innerHTML = "";
    $("focus-options").innerHTML = foci.map(function (f) { return '<option value="' + esc(f.name) + '">'; }).join("");
  }

  function notesLines(t) { return String(t.notes || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  function notesBlock(t) {
    var ls = notesLines(t);
    return '<div class="notes"><span class="st">Notes' + (ls.length ? " (" + ls.length + ")" : "") + "</span>" +
      ls.map(function (x, i) { return '<div class="nt" data-ni="' + i + '"><span class="nx">' + esc(x) + '</span><button type="button" class="sd" data-act="notedel" aria-label="Delete note">&times;</button></div>'; }).join("") +
      '<div class="nadd"><input type="text" class="sn" data-note-new placeholder="Add a note" aria-label="New note" enterkeyhint="done"><button type="button" class="nab" data-act="noteadd">Add</button></div></div>';
  }
  function setNotes(id, lines, refocus) {
    var t = tasks.filter(function (x) { return x.id === id; })[0]; if (!t) return;
    t.notes = lines.join("\n"); save(id, { notes: t.notes }); render();
    if (refocus) { var ni = document.querySelector('.task[data-id="' + id + '"] [data-note-new]'); if (ni) ni.focus(); }
  }
  function subsBlock(t) {
    var subs = t.subtasks || [];
    return '<div class="subs"><span class="st">Steps' + (subs.length ? " (" + subs.filter(function (x) { return x.done; }).length + "/" + subs.length + ")" : "") + "</span>" +
      subs.map(function (x) {
        return '<div class="sub' + (x.done ? " sdone" : "") + '" data-sid="' + esc(x.id) + '"><button type="button" class="sc" data-act="subdone" aria-label="Toggle step"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.6 2.5L10 3.5"/></svg></button><span class="sx">' + esc(x.t) + '</span><button type="button" class="sd" data-act="subdel" aria-label="Remove step">\u00d7</button></div>';
      }).join("") + '<input type="text" class="sn" data-sub-new placeholder="Add a step and press Enter" aria-label="New step"></div>';
  }
  function setSubs(id, subs, refocus) {

  }
  function newSid() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function blockerOf(t) { if (!t.blockedBy) return null; var b = tasks.filter(function (x) { return x.id === t.blockedBy; })[0]; return b && !b.done ? b : null; }
  function isWaiting(t) { return !!t.delegated || !!blockerOf(t); }
  function dependsSelect(t) {
    var cur = t.blockedBy || "", list = tasks.filter(function (x) { return !x.done && x.id !== t.id && x.blockedBy !== t.id && (x.area || "tranquebar") === (t.area || "tranquebar"); }).sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); });
    var o = '<option value="">Nothing, I can do it now</option>' + list.map(function (x) { var ti = String(x.title); if (ti.length > 60) ti = ti.slice(0, 58) + "\u2026"; return '<option value="' + esc(x.id) + '"' + (cur === x.id ? " selected" : "") + ">" + esc(ti) + "</option>"; }).join("");
    if (cur && !list.some(function (x) { return x.id === cur; })) o += '<option value="' + esc(cur) + '" selected>(finished task)</option>';
    return '<label class="wide">Depends on another task<select data-field="blockedBy">' + o + "</select></label>";
  }
  function panel(t) {
    var opts = AREAS.map(function (a) { return '<option value="' + a.id + '"' + ((t.area || "tranquebar") === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>"; }).join("");
    return '<div class="panel">' +
      '<label class="wide">Title<input type="text" data-field="title" value="' + esc(t.title) + '"></label>' +
      '<label>Area<select data-field="area">' + opts + "</select></label>" +
      '<label>Focus area<input type="text" data-field="focus" list="focus-options" value="' + esc(t.focus || "") + '" placeholder="Optional. A new name creates one."></label>' +
      '<label>Also under<input type="text" data-field="alsoFocus" list="focus-options" value="' + esc(t.alsoFocus || "") + '" placeholder="Optional second focus"></label>' +
      pplist("Following up with", t.people, "t:" + t.id + "|people", "people", function (n) { return 'data-act="pp" data-f="people" data-n="' + esc(n) + '"'; }, 'data-act="ppopen" data-k="t:' + esc(t.id) + '|people"') +
      pplist("Also involved", t.involved, "t:" + t.id + "|involved", "involved", function (n) { return 'data-act="pp" data-f="involved" data-n="' + esc(n) + '"'; }, 'data-act="ppopen" data-k="t:' + esc(t.id) + '|involved"', "wide") +
      dependsSelect(t) +
      '<label class="inline wide"><input type="checkbox" data-field="delegated"' + (t.delegated ? " checked" : "") + '>I handed this off and am following up</label>' +
      '<label class="wide">Remind me on<span class="dt"><input type="date" data-field="remindOn" value="' + esc(t.remindOn || "") + '"><input type="time" data-field="remindTime" value="' + esc(t.remindTime || "") + '" aria-label="Reminder time"></span>' +

      '<div class="wide rp"><span class="fl">Repeat</span><span class="quick">' + [["", "Off"], ["daily", "Days"], ["weekly", "Weeks"], ["monthly", "Months"]].map(function (r) { return '<button type="button" data-act="rep" data-v="' + r[0] + '" aria-pressed="' + ((t.repeat || "") === r[0]) + '">' + r[1] + "</button>"; }).join("") + "</span>" +

      subsBlock(t) +

  function row(t) {

    var bk = blockerOf(t); if (bk && !t.done) { var bt = String(bk.title); if (bt.length > 46) bt = bt.slice(0, 44) + "\u2026"; meta.unshift('<span class="blk">Waiting on: ' + esc(bt) + "</span>"); }

    } else if (state === "ready" && !query.trim() && view === "goals") h += '<button type="button" class="g-add" data-g="new">+ Add a daily goal</button>';

  $("goals").addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target && ev.target.id === "g-set") { ev.preventDefault(); var sb = $("goals").querySelector('[data-g="settotal"]'); if (sb) sb.click(); } else if (ev.key === "Enter" && ev.target && ev.target.id === "g-custom") { ev.preventDefault(); var b = $("goals").querySelector('[data-g="customadd"]'); if (b) b.click(); } else if (ev.key === "Escape" && goalCustom) { goalCustom = ""; renderGoals(); } });

    else if (act === "edit" && g) { goalEdit = { id: g.id, title: g.title || "", target: g.target || "", unit: g.unit || "", steps: (g.steps || []).join(", "), times: gtimes(g).map(fmtTime).join(", "), confirm: false }; renderGoals(); }

    } else if (act === "save" && goalEdit) {

  render();
  Promise.resolve(window.claude && window.claude.use ? window.claude.use("db") : null).catch(function () { return null; }).then(function (d) {
    if (!d) { db = null; state = "nodb"; render(); return; }

    }).then(function () { db = makeDb(d); start(); });
  });
  function makeDb(raw) {
    var P = "data/users/" + (myId || "me") + "/mine/";
    function find(id) { return tasks.filter(function (x) { return x.id === id; })[0]; }
    function tpath(personal) { return personal ? P + "tasks" : "tasks"; }

      collection: function (n) {
        if (n === "tasks") return {
          add: function (doc) { var p = doc.area === "personal"; if (!p && !doc.owner) doc = Object.assign({ owner: myId }, doc); return raw.collection(tpath(p)).add(doc); },
          onSnapshot: function (cb, err) {

            raw.collection(P + "tasks").onSnapshot(function (s) { b = s.docs; got |= 2; if (got === 3) fire(); }, function () { got |= 2; b = []; if (got === 3) fire(); });
          }

        return raw.collection(n);

      doc: function (path) {

        if (kind !== "tasks") return raw.doc(path);
        return {
          update: function (patch) {
            var t = find(id), cur = !!(t && t.area === "personal"), next = patch.area !== undefined ? patch.area === "personal" : cur;
            if (cur === next) return raw.doc(tpath(cur) + "/" + id).update(patch);
            var full = strip(Object.assign({}, t, patch)); if (!next && !full.owner) full.owner = myId;
            return raw.doc(tpath(next) + "/" + id).set(full).then(function () { return raw.doc(tpath(cur) + "/" + id).delete(); });
          },
          set: function (doc) { return raw.doc(tpath(doc.area === "personal") + "/" + id).set(strip(doc)); },
          delete: function () { var t = find(id); return raw.doc(tpath(!!(t && t.area === "personal")) + "/" + id).delete(); }
        };
      }
    };
  }
  function start() {
    if (!db) { state = "nodb"; render(); return; }
    var got = 0;
    function ready() { got++; if (got >= 2 && state !== "ready") { state = "ready"; } render(); }
    db.collection("tasks").onSnapshot(function (s) {

      if (state === "ready") schedule(); else ready();
    }, function () { state = "ready"; toast("Could not load tasks."); render(); });

    db.collection("goallogs").onSnapshot(function (s) { glogs = s.docs.map(function (x) { return Object.assign({}, x.data() || {}, { id: x.id }); }); if (state === "ready") renderGoals(); }, function () {});

      if (state === "ready") schedule(); else ready();
    }, function () { ready(); });
    nameOwners();
  }
  function nameOwners() {

      var ids = {}; tasks.forEach(function (t) { if (t.owner && t.owner !== myId && !ownerNames[t.owner]) ids[t.owner] = 1; });
      var list = Object.keys(ids); var key = list.join(","); if (!list.length || key === seen) return; seen = key;
      Promise.resolve(userCap.profiles(list)).then(function (ps) { list.forEach(function (i) { if (ps && ps[i] && ps[i].name) ownerNames[i] = ps[i].name; }); render(); }).catch(function () {});
    }, 2500);
  }
